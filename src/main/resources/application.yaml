spring:
  application:
    name: Luxumbourg-Post-Geo-Service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
